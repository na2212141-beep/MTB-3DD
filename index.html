<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; }
        #controls { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 100; pointer-events: none; }
        .btn-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.4); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; user-select: none; }
        .btn:active { background: rgba(255,255,255,0.9); color: #000; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-family: sans-serif; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; z-index: 1000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
</head>
<body>

<div id="loading">Загрузка трассы... Подожди...</div>

<div id="controls">
    <div class="btn-group">
        <div class="btn" id="btnLeft">←</div>
        <div class="btn" id="btnRight">→</div>
    </div>
    <div class="btn-group">
        <div class="btn" id="btnBrake">🛑</div>
        <div class="btn" id="btnGas">🔥</div>
    </div>
</div>

<script>
    // ===== 1. СЦЕНА =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 30, 200);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(20, 50, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // ===== 2. ФИЗИЧЕСКИЙ МИР =====
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    
    const groundMaterial = new CANNON.Material("ground");
    const wheelMaterial = new CANNON.Material("wheel");
    const contactMaterial = new CANNON.ContactMaterial(wheelMaterial, groundMaterial, { friction: 0.3, restitution: 0 });
    world.addContactMaterial(contactMaterial);

    // Невидимая плоскость на всякий случай (чтобы велик не улетел в бездну, если упадет с трассы)
    const floorBody = new CANNON.Body({ mass: 0, material: groundMaterial });
    floorBody.addShape(new CANNON.Plane());
    floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    floorBody.position.set(0, -10, 0); // Опускаем ее ниже трассы
    world.addBody(floorBody);

    // ===== 3. ЗАГРУЗКА ТРАССЫ И ВЕЛИКОВ =====
    const loader = new THREE.GLTFLoader();
    let bikeMesh = null;
    
    // 3.1 Загрузка Трассы (и создание для нее физики)
    loader.load('mtb-skillcenter_celerina.glb', function (gltf) {
        const trackModel = gltf.scene;
        trackModel.traverse((node) => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } });
        scene.add(trackModel);
        
        console.log("✅ Трасса загружена! Создаем физику...");
        
        // Превращаем визуальную трассу в физический объект (Trimesh)
        let vertices = [];
        let indices = [];
        
        trackModel.traverse((child) => {
            if (child.isMesh) {
                const geometry = child.geometry;
                const position = geometry.attributes.position;
                const index = geometry.index;
                
                // Применяем мировые координаты
                child.updateMatrixWorld();
                const matrix = child.matrixWorld;
                
                if (index) {
                    for (let i = 0; i < position.count; i++) {
                        const v = new THREE.Vector3().fromBufferAttribute(position, i);
                        v.applyMatrix4(matrix);
                        vertices.push(v.x, v.y, v.z);
                    }
                    for (let i = 0; i < index.count; i++) {
                        indices.push(index.getX(i));
                    }
                }
            }
        });
        
        const trackShape = new CANNON.Trimesh(vertices, indices);
        const trackBody = new CANNON.Body({ mass: 0, material: groundMaterial });
        trackBody.addShape(trackShape);
        world.addBody(trackBody);
        
        document.getElementById('loading').style.display = 'none';
        console.log("✅ Физика трассы готова!");
        
    }, undefined, (error) => {
        console.error("❌ Ошибка загрузки трассы:", error);
        document.getElementById('loading').innerText = "Ошибка загрузки трассы";
    });

    // 3.2 Загрузка Второго велика (Просто стоит для красоты)
    loader.load('mtb_mongoose_tyax.glb', function (gltf) {
        const mongoose = gltf.scene;
        mongoose.traverse((node) => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } });
        
        // Ставим его чуть в стороне. Возможно, придется поднять/опустить (второе число)
        mongoose.position.set(3, 5, 0); 
        // Если он огромный или маленький, раскомментируй строчку ниже:
        // mongoose.scale.set(0.5, 0.5, 0.5);
        
        scene.add(mongoose);
        console.log("✅ Второй велик (Mongoose) загружен!");
    });

    // ===== 4. ФИЗИКА ИГРОКА (Enduro) =====
    const chassisShape = new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 1));
    const chassisBody = new CANNON.Body({ mass: 80, material: wheelMaterial });
    chassisBody.addShape(chassisShape);
    
    // Ставим велик высоко над трассой, чтобы он упал на нее
    chassisBody.position.set(0, 15, 0); 
    chassisBody.angularDamping = 0.9;

    const vehicle = new CANNON.RaycastVehicle({
        chassisBody: chassisBody,
        indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
    });

    const wheelOptions = {
        radius: 0.4,
        directionLocal: new CANNON.Vec3(0, -1, 0),
        suspensionStiffness: 30,
        suspensionRestLength: 0.3,
        frictionSlip: 1.4,
        dampingRelaxation: 2.3,
        dampingCompression: 4.4,
        maxSuspensionForce: 100000,
        rollInfluence: 0.01,
        axleLocal: new CANNON.Vec3(-1, 0, 0),
        chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
        maxSuspensionTravel: 0.3,
        customSlidingRotationalSpeed: -30,
        useCustomSlidingRotationalSpeed: true,
    };

    wheelOptions.chassisConnectionPointLocal.set(0, 0, 1);
    vehicle.addWheel(wheelOptions);
    wheelOptions.chassisConnectionPointLocal.set(0, 0, -1);
    vehicle.addWheel(wheelOptions);
    vehicle.addToWorld(world);

    // Загрузка визуальной модели Enduro
    loader.load('enduro_bicycle_dh.glb', function (gltf) {
        bikeMesh = gltf.scene;
        bikeMesh.traverse((node) => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } });
        
        // ВАЖНО: Настройка масштаба и поворота для Enduro
        bikeMesh.scale.set(1, 1, 1); // Если велик огромный, поставь 0.1
        bikeMesh.rotation.y = Math.PI; // Если смотрит вбок, поменяй на 0 или Math.PI/2

        scene.add(bikeMesh);
    });

    // ===== 5. УПРАВЛЕНИЕ =====
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', (e) => { if (e.code in keys) keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { if (e.code in keys) keys[e.code] = false; });

    const btnGas = document.getElementById('btnGas');
    const btnBrake = document.getElementById('btnBrake');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    btnGas.addEventListener('touchstart', () => keys.ArrowUp = true);
    btnGas.addEventListener('touchend', () => keys.ArrowUp = false);
    btnBrake.addEventListener('touchstart', () => keys.ArrowDown = true);
    btnBrake.addEventListener('touchend', () => keys.ArrowDown = false);
    btnLeft.addEventListener('touchstart', () => keys.ArrowLeft = true);
    btnLeft.addEventListener('touchend', () => keys.ArrowLeft = false);
    btnRight.addEventListener('touchstart', () => keys.ArrowRight = true);
    btnRight.addEventListener('touchend', () => keys.ArrowRight = false);

    // ===== 6. АНИМАЦИЯ =====
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);
        
        world.step(1 / 60, dt, 3);

        const maxForce = 800; // Увеличил силу, чтобы легче было забираться в горку
        vehicle.applyEngineForce(keys.ArrowUp ? -maxForce : 0, 1);
        vehicle.applyEngineForce(keys.ArrowUp ? -maxForce : 0, 0);
        vehicle.setBrake(keys.ArrowDown ? 200 : 0, 0);
        vehicle.setBrake(keys.ArrowDown ? 200 : 0, 1);
        vehicle.setSteeringValue(keys.ArrowLeft ? 0.5 : keys.ArrowRight ? -0.5 : 0, 0);

        if (bikeMesh) {
            bikeMesh.position.copy(chassisBody.position);
            bikeMesh.quaternion.copy(chassisBody.quaternion);
            
            // Камера
            const cameraOffset = new THREE.Vector3(0, 3, -8); 
            cameraOffset.applyQuaternion(chassisBody.quaternion);
            camera.position.copy(chassisBody.position).add(cameraOffset);
            camera.lookAt(chassisBody.position);
        }

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
