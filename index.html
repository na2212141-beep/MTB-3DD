<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; touch-action: none; font-family: sans-serif; }
        
        /* Поворот экрана */
        #game-wrapper { position: absolute; top: 0; left: 0; transform-origin: top left; width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        /* Меню */
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 20, 30, 0.95); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #menu h1 { font-size: 40px; color: #fc0; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; }
        .bike-select { display: flex; gap: 20px; margin-bottom: 30px; }
        .bike-btn { padding: 15px 30px; background: #333; border: 2px solid #555; border-radius: 10px; color: white; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .bike-btn.active { background: #2a7; border-color: #0f0; box-shadow: 0 0 15px #0f0; }
        #play-btn { padding: 20px 60px; background: #e33; border: none; border-radius: 10px; color: white; font-size: 24px; font-weight: bold; cursor: pointer; opacity: 0.5; pointer-events: none; }
        #play-btn.ready { opacity: 1; pointer-events: auto; box-shadow: 0 0 20px #e33; }
        #loading-text { margin-top: 20px; font-size: 16px; color: #aaa; }

        /* Управление */
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 100; pointer-events: none; }
        .btn-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; font-size: 30px; display: flex; justify-content: center; align-items: center; user-select: none; backdrop-filter: blur(5px); }
        .btn:active { background: rgba(255,255,255,0.8); color: #000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
</head>
<body>

<div id="game-wrapper">
    <div id="menu">
        <h1>MTB 3D FREERIDE</h1>
        <div class="bike-select">
            <div class="bike-btn active" id="sel-enduro">Enduro DH</div>
            <div class="bike-btn" id="sel-mongoose">Mongoose Tyax</div>
        </div>
        <button id="play-btn">ЗАГРУЗКА...</button>
        <div id="loading-text">Скачиваем модели...</div>
    </div>

    <div id="controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">←</div>
            <div class="btn" id="btnRight">→</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btnBrake">🛑</div>
            <div class="btn" id="btnGas">🔥</div>
        </div>
    </div>
</div>

<script>
    // ===== 1. АДАПТАЦИЯ ЭКРАНА (ПОВОРОТ НА 90) =====
    const wrapper = document.getElementById('game-wrapper');
    function resizeScreen() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (h > w) {
            // Телефон вертикально - поворачиваем
            wrapper.style.width = h + 'px';
            wrapper.style.height = w + 'px';
            wrapper.style.transform = `rotate(90deg) translateY(-100%)`;
        } else {
            // Горизонтально
            wrapper.style.width = w + 'px';
            wrapper.style.height = h + 'px';
            wrapper.style.transform = 'none';
        }
        
        if (camera) {
            camera.aspect = (h > w ? w : w) / (h > w ? h : h);
            camera.updateProjectionMatrix();
            renderer.setSize(h > w ? h : w, h > w ? w : h);
        }
    }

    // ===== 2. НАСТРОЙКИ 3D =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrapper.appendChild(renderer.domElement);
    window.addEventListener('resize', resizeScreen);
    resizeScreen();

    // Свет
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -100;
    dirLight.shadow.camera.right = 100;
    dirLight.shadow.camera.top = 100;
    dirLight.shadow.camera.bottom = -100;
    scene.add(dirLight);

    // ===== 3. ФИЗИКА =====
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    const groundMaterial = new CANNON.Material("ground");
    const wheelMaterial = new CANNON.Material("wheel");
    world.addContactMaterial(new CANNON.ContactMaterial(wheelMaterial, groundMaterial, { friction: 0.5, restitution: 0 }));

    // Страховочная плоскость (если упадешь с трассы)
    const floorBody = new CANNON.Body({ mass: 0, material: groundMaterial });
    floorBody.addShape(new CANNON.Plane());
    floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    floorBody.position.set(0, -20, 0);
    world.addBody(floorBody);

    // ===== 4. ЗАГРУЗКА МОДЕЛЕЙ =====
    const manager = new THREE.LoadingManager();
    const loader = new THREE.GLTFLoader(manager);
    
    let trackLoaded = false, bikesLoaded = 0;
    let bikeModels = { enduro: null, mongoose: null };
    let activeBikeName = 'enduro';

    const btnPlay = document.getElementById('play-btn');
    const loadingText = document.getElementById('loading-text');

    manager.onProgress = function (url, itemsLoaded, itemsTotal) {
        loadingText.innerText = `Загрузка: ${itemsLoaded} из ${itemsTotal}...`;
    };

    manager.onLoad = function () {
        loadingText.innerText = "Всё готово!";
        btnPlay.innerText = "ПОЕХАЛИ!";
        btnPlay.classList.add('ready');
    };

    // 4.1. Трасса
    loader.load('mtb-skillcenter_celerina.glb', function (gltf) {
        const track = gltf.scene;
        track.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
        scene.add(track);
        
        // Создаем физику трассы (Trimesh)
        let vertices = [], indices = [];
        track.traverse((child) => {
            if (child.isMesh && child.geometry.attributes.position) {
                const pos = child.geometry.attributes.position;
                const idx = child.geometry.index;
                child.updateMatrixWorld();
                const mat = child.matrixWorld;
                
                if (idx) {
                    for (let i=0; i<pos.count; i++) {
                        const v = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(mat);
                        vertices.push(v.x, v.y, v.z);
                    }
                    for (let i=0; i<idx.count; i++) indices.push(idx.getX(i));
                }
            }
        });
        if (vertices.length > 0) {
            const trackShape = new CANNON.Trimesh(vertices, indices);
            const trackBody = new CANNON.Body({ mass: 0, material: groundMaterial });
            trackBody.addShape(trackShape);
            world.addBody(trackBody);
        }
    });

    // 4.2. Велики
    loader.load('enduro_bicycle_dh.glb', function (gltf) {
        bikeModels.enduro = gltf.scene;
        bikeModels.enduro.traverse(n => { if(n.isMesh) n.castShadow = true; });
        // Масштабирование (если нужно): bikeModels.enduro.scale.set(1,1,1);
    });
    
    loader.load('mtb_mongoose_tyax.glb', function (gltf) {
        bikeModels.mongoose = gltf.scene;
        bikeModels.mongoose.traverse(n => { if(n.isMesh) n.castShadow = true; });
    });

    // Меню выбора
    document.getElementById('sel-enduro').onclick = () => {
        document.getElementById('sel-enduro').classList.add('active');
        document.getElementById('sel-mongoose').classList.remove('active');
        activeBikeName = 'enduro';
    };
    document.getElementById('sel-mongoose').onclick = () => {
        document.getElementById('sel-mongoose').classList.add('active');
        document.getElementById('sel-enduro').classList.remove('active');
        activeBikeName = 'mongoose';
    };

    // ===== 5. ФИЗИКА ВЕЛОСИПЕДА (Cannon RaycastVehicle) =====
    const chassisShape = new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 1));
    const chassisBody = new CANNON.Body({ mass: 80, material: wheelMaterial });
    chassisBody.addShape(chassisShape);
    chassisBody.position.set(0, 10, 0); // Падает сверху
    chassisBody.angularDamping = 0.9; // Чтобы не крутился как юла

    const vehicle = new CANNON.RaycastVehicle({
        chassisBody: chassisBody,
        indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
    });

    const wheelOptions = {
        radius: 0.4, directionLocal: new CANNON.Vec3(0, -1, 0),
        suspensionStiffness: 30, suspensionRestLength: 0.3, frictionSlip: 1.4,
        dampingRelaxation: 2.3, dampingCompression: 4.4, maxSuspensionForce: 100000,
        rollInfluence: 0.05, // Влияет на наклон в поворотах
        axleLocal: new CANNON.Vec3(-1, 0, 0),
        chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
        maxSuspensionTravel: 0.3,
    };

    // Переднее колесо
    wheelOptions.chassisConnectionPointLocal.set(0, 0, 1.2);
    vehicle.addWheel(wheelOptions);
    // Заднее колесо
    wheelOptions.chassisConnectionPointLocal.set(0, 0, -1.2);
    vehicle.addWheel(wheelOptions);
    vehicle.addToWorld(world);

    // ===== 6. ЛОГИКА ИГРЫ =====
    let isPlaying = false;
    let activeBikeMesh = null;

    btnPlay.onclick = () => {
        document.getElementById('menu').style.display = 'none';
        isPlaying = true;
        
        // Добавляем выбранный велик на сцену
        activeBikeMesh = bikeModels[activeBikeName];
        if(activeBikeMesh) scene.add(activeBikeMesh);
    };

    // Управление
    const keys = { gas: false, brake: false, left: false, right: false };
    
    function bindBtn(id, key) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        el.addEventListener('mousedown', () => keys[key] = true);
        el.addEventListener('mouseup', () => keys[key] = false);
    }
    bindBtn('btnGas', 'gas');
    bindBtn('btnBrake', 'brake');
    bindBtn('btnLeft', 'left');
    bindBtn('btnRight', 'right');

    // Клавиатура
    window.addEventListener('keydown', e => {
        if(e.code === 'ArrowUp' || e.code === 'KeyW') keys.gas = true;
        if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.brake = true;
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    });
    window.addEventListener('keyup', e => {
        if(e.code === 'ArrowUp' || e.code === 'KeyW') keys.gas = false;
        if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.brake = false;
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    // ===== 7. ИГРОВОЙ ЦИКЛ =====
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);

        if (isPlaying) {
            world.step(1 / 60, dt, 3);

            const force = 800;
            vehicle.applyEngineForce(keys.gas ? -force : 0, 1);
            vehicle.applyEngineForce(keys.gas ? -force : 0, 0);
            vehicle.setBrake(keys.brake ? 200 : 0, 0);
            vehicle.setBrake(keys.brake ? 200 : 0, 1);
            vehicle.setSteeringValue(keys.left ? 0.5 : keys.right ? -0.5 : 0, 0);

            // Синхронизация 3D модели с физикой
            if (activeBikeMesh) {
                activeBikeMesh.position.copy(chassisBody.position);
                activeBikeMesh.quaternion.copy(chassisBody.quaternion);
                
                // ВАЖНО: Если велик в игре лежит на боку или смотрит не туда,
                // нужно добавить смещение. Например:
                // activeBikeMesh.rotation.y = Math.PI; // Развернуть
                // activeBikeMesh.position.y -= 1; // Опустить

                // Камера
                const camOffset = new THREE.Vector3(0, 3, -8);
                camOffset.applyQuaternion(chassisBody.quaternion);
                camera.position.lerp(chassisBody.position.clone().add(camOffset), 0.1);
                
                const lookAtPos = chassisBody.position.clone();
                lookAtPos.y += 1;
                camera.lookAt(lookAtPos);
            }
        }

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
