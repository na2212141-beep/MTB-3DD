<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #game-wrapper { position: absolute; top: 0; left: 0; transform-origin: top left; width: 100%; height: 100%; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a2a3a, #0a0a15); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        #menu h1 { font-size: 45px; color: #fc0; margin-bottom: 5px; text-shadow: 0 4px 10px rgba(252, 200, 0, 0.5); font-style: italic; letter-spacing: 2px; }
        #menu p { color: #8cf; margin-bottom: 20px; font-size: 18px; letter-spacing: 1px; }
        
        .selector-group { display: flex; gap: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .sel-btn { padding: 10px 20px; background: #333; border: 2px solid #555; border-radius: 10px; color: #ccc; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; }
        .sel-btn.active { background: #2a7; border-color: #0f0; color: #fff; box-shadow: 0 0 15px rgba(0, 255, 0, 0.6); transform: scale(1.05); }
        
        #play-btn { padding: 15px 50px; background: linear-gradient(to right, #2a7, #1d5); border: none; border-radius: 50px; color: white; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(42, 167, 100, 0.4); margin-top: 20px; transition: 0.2s; }
        #play-btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }
        
        #hud { position: absolute; top: 20px; left: 20px; color: white; z-index: 50; text-shadow: 2px 2px 4px #000; display: none; }
        #hud h2 { font-size: 22px; color: #fc0; }
        #hud p { font-size: 16px; margin: 5px 0; }
        #trick-text { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 35px; font-weight: bold; color: #e0e; text-shadow: 0 0 10px #e0e; z-index: 60; display: none; text-align: center; font-style: italic; }
        
        /* КНОПКИ УПРАВЛЕНИЯ */
        #controls { position: absolute; bottom: 15px; width: 100%; display: flex; flex-direction: row; justify-content: space-between; padding: 0 15px; z-index: 100; pointer-events: none; }
        .btn-group { display: flex; flex-direction: row; gap: 15px; pointer-events: auto; align-items: flex-end; }
        
        .btn { width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; user-select: none; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: transform 0.1s; }
        .btn:active { transform: scale(0.85); }
        
        .btn-arrow { background: rgba(50, 100, 200, 0.6); border: 3px solid #8cf; color: #fff; font-size: 32px; }
        .btn-gas { background: rgba(40, 167, 69, 0.8); border: 3px solid #4f4; }
        .btn-brake { background: rgba(220, 53, 69, 0.8); border: 3px solid #f44; }
        .btn-wheelie { background: rgba(255, 165, 0, 0.8); border: 3px solid #ff8c00; font-size: 12px; font-weight: bold; }
        .btn-trick { background: rgba(160, 32, 240, 0.8); border: 3px solid #e0e; font-size: 12px; font-weight: bold; }
        
        .btn svg { width: 35px; height: 35px; fill: none; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        
        #cam-toggle { position: absolute; top: 15px; right: 15px; z-index: 100; padding: 8px 15px; background: rgba(0,0,0,0.5); border: 2px solid #fff; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;}
        #online-status { position: absolute; top: 60px; right: 15px; color: #0f0; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 100; font-size: 14px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<div id="game-wrapper">
    <div id="menu">
        <h1>MTB FREERIDE 3D</h1>
        <p>МУЛЬТИПЛЕЕР</p>
        <div class="selector-group" id="track-select">
            <div class="sel-btn active" data-track="forest">Лес</div>
            <div class="sel-btn" data-track="desert">Пустыня</div>
            <div class="sel-btn" data-track="snow">Снег</div>
        </div>
        <div class="selector-group" id="bike-select">
            <div class="sel-btn active" data-bike="enduro">Enduro DH</div>
            <div class="sel-btn" data-bike="mongoose">Mongoose</div>
        </div>
        <button id="play-btn" disabled>ЗАГРУЗКА...</button>
    </div>

    <div id="hud">
        <h2 id="score-text">Очки: 0</h2>
        <p id="speed-text">Скорость: 0 км/ч</p>
    </div>
    <div id="online-status">🟡 ПОДКЛЮЧЕНИЕ...</div>
    <div id="trick-text">BACKFLIP!</div>
    <div id="cam-toggle">Вид: FPS</div>

    <div id="controls">
        <div class="btn-group">
            <div class="btn btn-arrow" id="btnLeft">←</div>
            <div class="btn btn-arrow" id="btnRight">→</div>
        </div>
        <div class="btn-group">
            <div class="btn btn-wheelie" id="btnWheelie">ВИЛЛИ</div>
            <div class="btn btn-trick" id="btnTrick">ТРЮК</div>
            <div class="btn btn-brake" id="btnBrake">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            <div class="btn btn-gas" id="btnGas">
                <svg viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path><circle cx="12" cy="12" r="4"></circle></svg>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== 1. СЕТЬ (МУЛЬТИПЛЕЕР) =====
    const socket = io('https://mtb-server.onrender.com', { transports: ['websocket'] });
    let myNick = localStorage.getItem('mtb_nick') || 'Гонщик_' + Math.floor(Math.random() * 1000);
    
    const otherPlayers = {}; 
    let lastNetEmit = 0;

    socket.on('connect', () => {
        console.log('✅ Подключено к серверу мультиплеера!');
        document.getElementById('online-status').innerText = "🟢 В СЕТИ";
        document.getElementById('online-status').style.color = "#0f0";
    });
    
    socket.on('disconnect', () => {
        document.getElementById('online-status').innerText = "🔴 ОФЛАЙН";
        document.getElementById('online-status').style.color = "#f55";
    });

    socket.on('opponentMove', (data) => {
        if (!otherPlayers[data.id]) {
            if (bikesLoaded.enduro) {
                const ghostBike = bikesLoaded.enduro.clone();
                ghostBike.scale.set(1.5, 1.5, 1.5);
                ghostBike.traverse(n => {
                    if (n.isMesh) {
                        n.material = n.material.clone();
                        n.material.transparent = true;
                        n.material.opacity = 0.8;
                    }
                });
                scene.add(ghostBike);
                otherPlayers[data.id] = { mesh: ghostBike, targetPos: new THREE.Vector3(), targetRot: new THREE.Euler() };
            }
        }
        
        if (otherPlayers[data.id]) {
            otherPlayers[data.id].targetPos.set(data.x, data.y, data.z);
            otherPlayers[data.id].targetRot.set(data.rotX || 0, data.rotY || 0, data.rotZ || 0);
        }
    });

    // ===== 2. НАСТРОЙКИ 3D =====
    const wrapper = document.getElementById('game-wrapper');
    function resizeScreen() {
        const w = window.innerWidth; const h = window.innerHeight;
        if (h > w) { wrapper.style.width = h + 'px'; wrapper.style.height = w + 'px'; wrapper.style.transform = `rotate(90deg) translateY(-100%)`; } 
        else { wrapper.style.width = w + 'px'; wrapper.style.height = h + 'px'; wrapper.style.transform = 'none'; }
        if (camera) { camera.aspect = (h > w ? w : w) / (h > w ? h : h); camera.updateProjectionMatrix(); renderer.setSize(h > w ? h : w, h > w ? w : h); }
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    wrapper.appendChild(renderer.domElement);
    window.addEventListener('resize', resizeScreen);
    resizeScreen();

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    const gameState = {
        z: 0, x: 0, y: 0, speed: 0, maxSpeed: 35, velY: 0,
        rotX: 0, rotY: 0, rotZ: 0, isJumping: false,
        trick: "", trickTimer: 0, score: 0, suspension: 0, suspensionVel: 0
    };

    let currentTrack = 'forest';
    const trackColors = {
        forest: { ground: 0x2e8b57, sky: 0x87CEEB },
        desert: { ground: 0xd2b48c, sky: 0xffd700 },
        snow:   { ground: 0xeeeeee, sky: 0xaaaaaa }
    };

    let groundMesh;
    const groundGeo = new THREE.PlaneGeometry(2000, 2000, 100, 100);
    function getGroundHeight(z) { return Math.sin(z * 0.05) * 3 + Math.cos(z * 0.02) * 5; }

    function generateTrack(type) {
        if (groundMesh) scene.remove(groundMesh);
        const colors = trackColors[type];
        scene.background = new THREE.Color(colors.sky);
        scene.fog = new THREE.Fog(colors.sky, 50, 300);
        const vertices = groundGeo.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const z = vertices[i + 1];
            vertices[i + 2] = Math.sin(z * 0.05) * 3 + Math.cos(z * 0.02) * 5;
        }
        groundGeo.computeVertexNormals();
        groundMesh = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: colors.ground, flatShading: true }));
        groundMesh.rotation.x = -Math.PI / 2;
        scene.add(groundMesh);
    }

    // ===== 3. 3D РУЛЬ (FPS) =====
    const cockpitGroup = new THREE.Group();
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
    const handMat = new THREE.MeshStandardMaterial({ color: 0xe8b48a });
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 8), metalMat); bar.rotation.z = Math.PI / 2; cockpitGroup.add(bar);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8), metalMat); stem.position.set(0, -0.1, 0.2); stem.rotation.x = Math.PI / 2; cockpitGroup.add(stem);
    const gripL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 8), gripMat); gripL.rotation.z = Math.PI / 2; gripL.position.set(-0.45, 0, 0); cockpitGroup.add(gripL);
    const gripR = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 8), gripMat); gripR.rotation.z = Math.PI / 2; gripR.position.set(0.45, 0, 0); cockpitGroup.add(gripR);
    
    const handGeo = new THREE.BoxGeometry(0.12, 0.12, 0.15);
    const handL = new THREE.Mesh(handGeo, handMat); handL.position.set(-0.45, 0.05, 0.05); cockpitGroup.add(handL);
    const handR = new THREE.Mesh(handGeo, handMat); handR.position.set(0.45, 0.05, 0.05); cockpitGroup.add(handR);
    
    const armGeo = new THREE.CylinderGeometry(0.05, 0.04, 0.6, 8);
    const armL = new THREE.Mesh(armGeo, handMat); armL.position.set(-0.4, -0.2, 0.3); armL.rotation.x = Math.PI / 4; armL.rotation.z = -0.2; cockpitGroup.add(armL);
    const armR = new THREE.Mesh(armGeo, handMat); armR.position.set(0.4, -0.2, 0.3); armR.rotation.x = Math.PI / 4; armR.rotation.z = 0.2; cockpitGroup.add(armR);
    
    cockpitGroup.visible = false;
    scene.add(cockpitGroup);

    // ===== 4. ЗАГРУЗКА ВЕЛИКОВ =====
    let activeBike = null;
    let isPlaying = false;
    let isFPV = true;
    const loader = new THREE.GLTFLoader();
    let bikesLoaded = { enduro: null, mongoose: null };
    let selectedBike = 'enduro';

    loader.load('https://na2212141-beep.github.io/MTB-3DD/enduro_bicycle_dh.glb', (gltf) => {
        bikesLoaded.enduro = gltf.scene;
        bikesLoaded.enduro.scale.set(1.5, 1.5, 1.5); 
        
        document.getElementById('play-btn').disabled = false;
        document.getElementById('play-btn').innerText = "ПОЕХАЛИ!";
        
        loader.load('https://na2212141-beep.github.io/MTB-3DD/mtb_mongoose_tyax.glb', (gltf2) => {
            bikesLoaded.mongoose = gltf2.scene;
            bikesLoaded.mongoose.scale.set(1.5, 1.5, 1.5);
        });
    });

    function setupMenu(containerId, callback) {
        const container = document.getElementById(containerId);
        const buttons = container.querySelectorAll('.sel-btn');
        buttons.forEach(btn => {
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); buttons.forEach(b => b.classList.remove('active')); btn.classList.add('active'); callback(btn.dataset); });
        });
    }
    setupMenu('track-select', (data) => { currentTrack = data.track; });
    setupMenu('bike-select', (data) => { selectedBike = data.bike; });

    document.getElementById('play-btn').onclick = () => {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        generateTrack(currentTrack);
        activeBike = bikesLoaded[selectedBike] || bikesLoaded['enduro'];
        activeBike.visible = !isFPV;
        scene.add(activeBike);
        
        gameState.z = 0; gameState.x = 0; gameState.y = getGroundHeight(0) + 0.5; 
        gameState.speed = 0; gameState.velY = 0; gameState.suspension = 0;
        cockpitGroup.visible = isFPV;
        isPlaying = true;
    };

    document.getElementById('cam-toggle').onclick = () => {
        isFPV = !isFPV;
        document.getElementById('cam-toggle').innerText = isFPV ? "Вид: FPS" : "Вид: 3-е лицо";
        if (activeBike) activeBike.visible = !isFPV; 
        cockpitGroup.visible = isFPV && isPlaying;
    };

    const keys = { gas: false, brake: false, left: false, right: false, wheelie: false };
    function bindBtn(id, key) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        el.addEventListener('mousedown', () => keys[key] = true);
        el.addEventListener('mouseup', () => keys[key] = false);
    }
    bindBtn('btnGas', 'gas'); bindBtn('btnBrake', 'brake'); bindBtn('btnLeft', 'left'); bindBtn('btnRight', 'right'); bindBtn('btnWheelie', 'wheelie');

    document.getElementById('btnTrick').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameState.isJumping && gameState.trickTimer <= 0) {
            const tricks = ["BACKFLIP", "FRONTFLIP", "360 SPIN"];
            gameState.trick = tricks[Math.floor(Math.random() * tricks.length)];
            if (gameState.trick === "BACKFLIP") gameState.rotX = -0.15;
            if (gameState.trick === "FRONTFLIP") gameState.rotX = 0.15;
            if (gameState.trick === "360 SPIN") gameState.rotY = 0.15;
            const trickUI = document.getElementById('trick-text');
            trickUI.innerText = gameState.trick + "!";
            trickUI.style.display = 'block';
            gameState.score += 500;
            gameState.trickTimer = 1.5;
        }
    });

    window.addEventListener('keydown', e => {
        if(e.code === 'ArrowUp' || e.code === 'KeyW') keys.gas = true;
        if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.brake = true;
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if(e.code === 'Space') keys.wheelie = true;
    });
    window.addEventListener('keyup', e => {
        if(e.code === 'ArrowUp' || e.code === 'KeyW') keys.gas = false;
        if(e.code === 'ArrowDown' || e.code === 'KeyS') keys.brake = false;
        if(e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if(e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if(e.code === 'Space') keys.wheelie = false;
    });

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);

        if (isPlaying && activeBike) {
            // Разгон
            if (keys.gas) gameState.speed += 15 * dt;
            else if (keys.brake) gameState.speed -= 30 * dt;
            else gameState.speed -= 5 * dt;
            gameState.speed = Math.max(0, Math.min(gameState.maxSpeed, gameState.speed));
            
            // Повороты
            if (keys.left) gameState.x -= 20 * dt;
            if (keys.right) gameState.x += 20 * dt;

            // Движение
            gameState.z -= gameState.speed * dt;
            const targetY = getGroundHeight(gameState.z);
            
            // Прыжки
            if (gameState.y > targetY + 0.5) {
                gameState.isJumping = true;
                gameState.velY -= 30 * dt; 
                gameState.y += gameState.velY * dt;
            } else {
                if (gameState.isJumping) {
                    gameState.suspension = -1.5; gameState.suspensionVel = 0; gameState.isJumping = false;
                    gameState.velY = 0; gameState.rotX = 0; gameState.rotY = 0;
                    document.getElementById('trick-text').style.display = 'none';
                }
                gameState.y = targetY + 0.5; 
                if (gameState.speed > 15 && Math.random() < 0.1) { gameState.suspension = -0.5; }
            }

            // Вилли
            if (keys.wheelie && !gameState.isJumping) { gameState.rotX = -0.3; } 
            else if (!gameState.isJumping && gameState.rotX === -0.3) { gameState.rotX = 0; }

            // Трюки
            if (gameState.isJumping && gameState.trickTimer > 0) {
                gameState.trickTimer -= dt;
                activeBike.rotation.x += gameState.rotX;
                activeBike.rotation.y += gameState.rotY;
            }

            // Визуальная подвеска
            const springStrength = 80; const damping = 12; 
            gameState.suspensionVel += -springStrength * gameState.suspension * dt;
            gameState.suspensionVel *= Math.exp(-damping * dt);
            gameState.suspension += gameState.suspensionVel * dt;

            let visualY = gameState.y + (gameState.suspension * 0.5);
            activeBike.position.set(gameState.x, visualY, gameState.z);
            
            // Наклоны
            if (!gameState.isJumping && !keys.wheelie) {
                if (keys.left) activeBike.rotation.z = 0.2;
                else if (keys.right) activeBike.rotation.z = -0.2;
                else activeBike.rotation.z = 0;
                activeBike.rotation.x = (-Math.sin(gameState.z * 0.05) * 0.2) + (gameState.suspension * 0.3); 
            }

            // Камера
            let camShake = gameState.suspension * 0.2;
            if (isFPV) {
                camera.position.set(gameState.x, visualY + 1.2 + camShake, gameState.z);
                camera.lookAt(gameState.x, visualY + 0.5, gameState.z - 10);
                
                // Руль
                cockpitGroup.position.set(gameState.x, visualY + 0.8 + camShake, gameState.z - 0.5);
                cockpitGroup.rotation.copy(camera.rotation);
                if (keys.left) cockpitGroup.rotation.z = 0.2;
                else if (keys.right) cockpitGroup.rotation.z = -0.2;
                else cockpitGroup.rotation.z = 0;
            } else {
                camera.position.set(gameState.x, visualY + 4 + camShake, gameState.z + 8);
                camera.lookAt(activeBike.position);
            }

            // ===== ОТПРАВКА КООРДИНАТ В СЕТЬ =====
            if (Date.now() - lastNetEmit > 50 && socket.connected) {
                socket.emit('playerMove', { 
                    x: gameState.x, y: gameState.y, z: gameState.z, 
                    rotX: activeBike.rotation.x, rotY: activeBike.rotation.y, rotZ: activeBike.rotation.z,
                    nick: myNick 
                });
                lastNetEmit = Date.now();
            }

            // Отрисовка других игроков
            for (let id in otherPlayers) {
                const opp = otherPlayers[id];
                opp.mesh.position.lerp(opp.targetPos, 0.2);
                opp.mesh.rotation.x = THREE.MathUtils.lerp(opp.mesh.rotation.x, opp.targetRot.x, 0.2);
                opp.mesh.rotation.y = THREE.MathUtils.lerp(opp.mesh.rotation.y, opp.targetRot.y, 0.2);
                opp.mesh.rotation.z = THREE.MathUtils.lerp(opp.mesh.rotation.z, opp.targetRot.z, 0.2);
            }

            document.getElementById('score-text').innerText = "Очки: " + gameState.score;
            document.getElementById('speed-text').innerText = "Скорость: " + Math.round(gameState.speed * 3.6) + " км/ч";
        }

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
