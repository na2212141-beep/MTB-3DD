<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        #debug { position: absolute; top: 10px; left: 10px; font-size: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; z-index: 9999; width: 90%; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="debug">Запуск...</div>

<script>
    const dbg = document.getElementById('debug');
    
    // Ловим любые ошибки
    window.onerror = function(msg, url, line) {
        dbg.innerHTML = "❌ ОШИБКА КОДА:<br>" + msg + "<br>Строка: " + line;
        dbg.style.background = "red";
    };

    try {
        dbg.innerHTML = "1. Создаем 3D сцену...";
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 1));

        // Простой пол (чтобы видеть, куда падает)
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshBasicMaterial({color: 0x5a3d1f}));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        dbg.innerHTML = "2. Начинаем скачивать велик...";

        const loader = new THREE.GLTFLoader();
        
        // Скачиваем велик по прямой ссылке
        loader.load('https://na2212141-beep.github.io/MTB-3DD/enduro_bicycle_dh.glb', 
            function (gltf) {
                dbg.innerHTML = "3. Велик успешно скачан!<br>Встраиваем в игру...";
                
                const bike = gltf.scene;
                // Если велик маленький, вот тут его размер:
                bike.scale.set(2, 2, 2); 
                scene.add(bike);

                dbg.innerHTML = "✅ ВСЁ РАБОТАЕТ!";
                setTimeout(() => { dbg.style.display = 'none'; }, 2000); // Прячем текст через 2 сек
            }, 
            function (xhr) {
                // Показываем прогресс загрузки
                if (xhr.total > 0) {
                    let p = Math.round((xhr.loaded / xhr.total) * 100);
                    dbg.innerHTML = "2. Скачиваем велик: " + p + "%";
                } else {
                    dbg.innerHTML = "2. Скачиваем велик... (размер неизвестен)";
                }
            }, 
            function (error) {
                dbg.innerHTML = "❌ ОШИБКА ЗАГРУЗКИ ФАЙЛА!<br>Файл не найден по ссылке.";
                dbg.style.background = "red";
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

    } catch (e) {
        dbg.innerHTML = "❌ КРИТИЧЕСКАЯ ОШИБКА:<br>" + e.message;
        dbg.style.background = "red";
    }
</script>
</body>
</html>
